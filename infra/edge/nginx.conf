# 平台边缘代理：HTTPS 终止、前端静态资源与 /api 反向代理
#
# 证书默认来自镜像内自签（构建时生成），生产可用卷覆盖 /etc/nginx/tls。
# 上游固定为 compose 中的 app 服务：容器内只有网关监听 0.0.0.0:8080。

# 明文入口只做跳转，避免 token 走明文
server {
    listen 80;
    server_name _;

    # 容器探针走明文，不跟随跳转
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API 统一走网关：身份头与权限校验都由网关生成，边缘只做转发
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 前端为 history 路由，未命中文件时回落到 index.html
    # index.html 必须每次回源校验：它引用的入口 js 带内容哈希，一旦缓存住旧文件，
    # 页签就会去要上一版镜像里已经不存在的 chunk，路由懒加载 404 白屏。
    # 用 expires 而不是 add_header，避免本 location 丢掉 server 级的安全响应头。
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # 构建产物带内容哈希，可长缓存
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
