services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: agri
      POSTGRES_USER: agri
      POSTGRES_PASSWORD: agri
    ports:
      - "5432:5432"
    volumes:
      - agri-postgres:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agri -d agri"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - agri-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 应用服务（profile app 才启动，默认只用基础设施）
  # 单容器内跑全部 15 个 HTTP 服务，仅网关对外；反代与 HTTPS 在 edge
  app:
    build:
      context: ..
      target: app
      args:
        VITE_TIANDITU_KEY: ${VITE_TIANDITU_KEY:-}
    image: agri-platform:local
    profiles: ["app"]
    # 自动加载仓库根的本地 .env（真 Key 只存本地，.gitignore 已忽略）；
    # 不存在时不阻断启动，便于 CI/仅基础设施场景。
    env_file:
      - path: ../.env
        required: false
    environment:
      SERVICE_HOST: "0.0.0.0"
      NODE_ENV: production
      DB_URL: postgresql://agri:agri@postgres:5432/agri
      DB_POOL_SIZE: "20"
      AUTH_REPOSITORY_MODE: sql
      PLATFORM_REPOSITORY_MODE: sql
      PLOT_REPOSITORY_MODE: sql
      MESSAGE_REPOSITORY_MODE: sql
      CONTROL_REPOSITORY_MODE: sql
      IOT_REPOSITORY_MODE: sql
      TRACE_REPOSITORY_MODE: sql
      FINANCE_REPOSITORY_MODE: sql
      # 部署环境开启服务侧二次校验，网关始终强制鉴权
      AUTH_GUARD_MODE: enforce
      GATEWAY_AUTH_ENABLED: "true"
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-agri-internal}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-7200}
      TELEMETRY_PUBLISH_EVENTS: "true"
      FILE_STORAGE_MODE: s3
      FILE_S3_ENDPOINT: http://minio:9000
      FILE_S3_BUCKET: agri
      FILE_S3_REGION: us-east-1
      FILE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      FILE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # 现场协议网关开关：默认关（没配现场凭证就常驻轮询，只刷未授权下发失败日志）。
      # 现场设备到位、凭证就绪后再置 1 启用；scripts/smoke-device-protocol.mjs 在冒烟现场网关时显式设 1。
      FIELD_GATEWAY_ENABLED: ${FIELD_GATEWAY_ENABLED:-}
      # 和风天气可插拔接入：上面 `env_file: ../.env` 会自动将本地 QWEATHER_KEY / QWEATHER_KEY_ID / QWEATHER_DEVELOPER_ID / QWEATHER_PROJECT_ID 等写入容器。
      # 不在 `environment:` 里重新展开 ${QWEATHER_KEY:-}，否则 compose 插值会用 shell 变量（通常为空）覆盖 env_file。
      # 留空时 sync.ts 中 buildQWeatherFromEnv 返回 undefined，服务行为与接入前完全一致。
      # JWT 场景：下方 volumes 只读挂载仓库根 ed25519-private.pem 到容器内，供 QWEATHER_PRIVATE_KEY_PATH 读取；私钥缺失时签发器自动降级为不启用。
      QWEATHER_PRIVATE_KEY_PATH: ${QWEATHER_PRIVATE_KEY_PATH:-/run/secrets/qweather-private.pem}
      WEATHER_REPOSITORY_MODE: ${WEATHER_REPOSITORY_MODE:-sql}
    volumes:
      - ../ed25519-private.pem:/run/secrets/qweather-private.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 镜像内没有 curl，用 node 自带 fetch 检测网关健康端点
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # 边缘：HTTPS 终止 + 前端静态资源 + /api 反代到网关
  edge:
    build:
      context: ..
      target: edge
    image: agri-platform-edge:local
    profiles: ["app"]
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    # 生产证书：把 fullchain.pem / privkey.pem 放到 infra/certs 后取消注释，覆盖镜像内自签证书
    # volumes:
    #   - ./certs:/etc/nginx/tls:ro

volumes:
  agri-postgres:
  agri-minio:
